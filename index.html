<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pay Anyway prototype</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--page:#EFEAE4;--bg:#FAF8F4;--card:#fff;--line:#E4E1DB;--ink:#2A1F22;--mute:#8B857E;--red:#EA2229;--red-d:#C81A20;--g1:#F7B9B9;--g2:#F3D9B5;--ok:#1E8E4E;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1B1719}}
:root[data-theme="dark"]{--page:#1B1719}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);font-family:'Poppins','Hind Siliguri',system-ui,sans-serif;color:var(--ink)}
.phone{max-width:420px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;overflow:hidden;display:flex;flex-direction:column}
.top{background:linear-gradient(120deg,var(--g1),var(--g2));padding:16px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.top h1{font-size:18px;font-weight:600;margin:0;flex:1;text-align:center}
.top button{background:none;border:0;font-size:24px;color:var(--ink);width:32px;height:32px;cursor:pointer;padding:0}
.lang{font-size:12px!important;width:auto!important;border:1px solid rgba(42,31,34,.35)!important;border-radius:14px;padding:3px 9px!important;font-family:inherit}
.body{padding:18px;flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.merch{display:flex;gap:14px;align-items:center}
.qr{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:9px;font-weight:600;color:var(--ok)}
.merch b{font-weight:500;font-size:17px;display:block}.merch span{color:var(--mute);font-size:15px}
.lbl{font-size:15px}.lbl i{color:var(--red);font-style:normal}
.amt{width:100%;border:0;border-bottom:1px solid var(--line);font:500 34px 'Poppins',sans-serif;padding:10px 0;margin-bottom:14px;background:none;color:var(--ink);outline:none}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 18px;font:400 15px 'Poppins',sans-serif;color:var(--ink);cursor:pointer}
.chip.on{border-color:var(--red)}
.avail{font-size:14px;margin-top:10px}.avail b{font-weight:600}
.ptitle{font-size:15px;margin-bottom:2px}
.src{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer;font-family:inherit;color:var(--ink)}
.src.on{border:2px solid var(--red);padding:11px 13px}
.src .ic{width:42px;height:38px;border-radius:10px;background:#F6EFE8;display:grid;place-items:center;font-style:normal;font-weight:600;font-size:11px}
.src div{flex:1}.src b{display:block;font-weight:500;font-size:15px}.src span{display:block;font-size:12.5px;color:var(--mute)}.src span.lo{color:var(--red)}
.rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}.src.on .rd{border:6px solid var(--red)}
.btn{width:100%;background:var(--red);color:#fff;border:0;border-radius:14px;padding:18px;font:500 17px 'Hind Siliguri','Poppins',sans-serif;cursor:pointer}
.btn:active{background:var(--red-d)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid #1B6EF3;outline-offset:2px}
.scrim{position:absolute;inset:0;background:rgba(30,20,22,.45);display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;border-radius:22px 22px 0 0;padding:22px 18px 26px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:19px;font-weight:600}.sheet p{margin:0 0 16px;color:var(--mute);font-size:14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px;cursor:pointer;font-family:inherit;color:var(--ink)}
.opt.main{border:2px solid var(--red)}
.opt b{display:block;font-weight:500;font-size:16px}.opt span{font-size:13px;color:var(--mute)}
.pin{text-align:center;padding-top:10px}
.dots{display:flex;justify-content:center;gap:16px;margin:22px 0 8px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--red)}.dot.f{background:var(--red)}
.err{color:var(--red);font-size:14px;min-height:20px}.hint{color:var(--mute);font-size:13px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.key{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 0;font:500 22px 'Poppins',sans-serif;color:var(--ink);cursor:pointer}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.center{text-align:center;padding-top:80px}
.spin{width:46px;height:46px;border:4px solid var(--line);border-top-color:var(--red);border-radius:50%;margin:0 auto 20px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.tick{width:72px;height:72px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:grid;place-items:center;margin:0 auto 16px}
.row{display:flex;justify-content:space-between;font-size:14px;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row span{color:var(--mute)}
.note{text-align:center;font-size:12px;color:var(--mute);padding:10px 18px calc(12px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="phone" id="app"></div>
<script>
const T={en:{pw:"Pay with",wl:"Wallet",cd:"Visa credit card ••••4821",bk:"Bank account ••••3092",lowb:"Not enough for this payment",ob:a=>`Pay Tk ${a} from bank ••••3092`,obs:"Direct from your bank account",t:"Merchant Pay",amt:"Amount",av:"Available balance:",tk:"Tk",next:"Next",short:n=>`You’re Tk ${n} short`,sub:"Finish this payment without leaving this screen.",oc:a=>`Pay Tk ${a} from Visa ••••4821`,ocs:"Full amount from your saved card",oa:n=>`Add Tk ${n} and pay`,oas:n=>`Only the missing Tk ${n}, from Visa ••••4821`,cx:"Cancel",pin:"Enter your PIN",hint:"Sample PIN: 1234",bad:"Wrong PIN. Try again.",ret:"Returning to your payment to Ms Rajib…",ok:"Payment successful",to:"Paid to",via:"Paid with",wal:"Wallet",bal:"Wallet balance",again:"Start over",note:"Prototype with sample data. No real money moves."},
bn:{pw:"যে মাধ্যমে পে করবেন",wl:"ওয়ালেট",cd:"Visa ক্রেডিট কার্ড ••••4821",bk:"ব্যাংক অ্যাকাউন্ট ••••3092",lowb:"এই পেমেন্টের জন্য যথেষ্ট নয়",ob:a=>`ব্যাংক ••••3092 থেকে ৳${a} পে করুন`,obs:"সরাসরি ব্যাংক অ্যাকাউন্ট থেকে",t:"মার্চেন্ট পে",amt:"পরিমাণ",av:"ব্যবহারযোগ্য ব্যালেন্স:",tk:"টাকা",next:"পরবর্তী",short:n=>`আপনার ৳${n} কম পড়েছে`,sub:"এই স্ক্রিন থেকেই পেমেন্ট শেষ করুন।",oc:a=>`Visa ••••4821 থেকে ৳${a} পে করুন`,ocs:"সংরক্ষিত কার্ড থেকে পুরো টাকা",oa:n=>`৳${n} যোগ করে পে করুন`,oas:n=>`শুধু ঘাটতির ৳${n}, Visa ••••4821 থেকে`,cx:"বাতিল",pin:"আপনার PIN দিন",hint:"নমুনা PIN: 1234",bad:"PIN ভুল। আবার চেষ্টা করুন।",ret:"Ms Rajib-এর পেমেন্টে ফিরছি…",ok:"পেমেন্ট সফল",to:"প্রাপক",via:"পেমেন্ট মাধ্যম",wal:"ওয়ালেট",bal:"ওয়ালেট ব্যালেন্স",again:"আবার শুরু করুন",note:"নমুনা তথ্য দিয়ে প্রোটোটাইপ। আসল টাকা যায় না।"}};
const BAL=465;
let s={lang:"en",scr:"pay",amt:500,mode:null,src:"wallet",from:"pay",pin:"",bad:false};
const $=document.getElementById("app");
function render(){
 const L=T[s.lang],short=s.amt-BAL;
 let h=`<div class="top"><button data-a="back" aria-label="Back">←</button><h1>${L.t}</h1><button class="lang" data-a="lang">${s.lang=="en"?"বাংলা":"EN"}</button></div><div class="body">`;
 if(s.scr=="pay"||s.scr=="sheet"){
  h+=`<div class="card merch"><div class="qr">BANGLA<br>QR</div><div><b>Ms Rajib</b><span>901752000011698163</span></div></div>
  <div class="card"><div class="lbl">${L.amt}<i>*</i></div><input class="amt" id="amt" inputmode="numeric" value="৳${s.amt}" aria-label="${L.amt}">
  <div class="chips">${[500,1000,2000,5000].map(v=>`<button class="chip ${v==s.amt?"on":""}" data-a="chip" data-v="${v}">৳${v.toLocaleString("en")}</button>`).join("")}</div>
  <div class="avail">${L.av} <b>${BAL} ${L.tk}</b></div></div>
  <div class="card"><div class="lbl ptitle">${L.pw}</div>${[["wallet","৳",L.wl,`${BAL} ${L.tk}`],["card","VISA",L.cd,""],["bank","BANK",L.bk,""]].map(([k,ic,n,sub])=>`<button class="src ${s.src==k?"on":""}" data-a="src" data-v="${k}"><i class="ic">${ic}</i><div><b>${n}</b>${sub?`<span>${sub}</span>`:""}${k=="wallet"&&s.amt>BAL?`<span class="lo">${L.lowb}</span>`:""}</div><em class="rd"></em></button>`).join("")}</div>
  <button class="btn" data-a="next">${L.next}</button>`;
 }
 if(s.scr=="pin"){
  h+=`<div class="pin"><h2 style="font-weight:600;margin:0">${L.pin}</h2><div class="dots ${s.bad?"shake":""}">${[0,1,2,3].map(i=>`<div class="dot ${i<s.pin.length?"f":""}"></div>`).join("")}</div><div class="err">${s.bad?L.bad:""}</div><div class="hint">${L.hint}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button class="key" data-a="key" data-v="${k}">${k}</button>`).join("")}</div></div>`;
 }
 if(s.scr=="proc") h+=`<div class="center"><div class="spin"></div><b style="font-weight:500">${L.ret}</b></div>`;
 if(s.scr=="done"){
  const nb=s.mode=="add"?BAL+short-s.amt:s.mode=="card"||s.mode=="bank"?BAL:BAL-s.amt;
  const via=s.mode=="card"?"Visa ••••4821":s.mode=="bank"?"Bank ••••3092":s.mode=="add"?`${L.wal} (+৳${short} Visa ••••4821)`:L.wal;
  h+=`<div class="center" style="padding-top:30px"><div class="tick">✓</div><h2 style="margin:0 0 4px;font-weight:600">${L.ok}</h2><div style="font:500 30px Poppins;margin-bottom:22px">৳${s.amt}</div></div>
  <div class="card"><div class="row"><span>${L.to}</span><b style="font-weight:500">Ms Rajib</b></div><div class="row"><span>${L.via}</span><b style="font-weight:500">${via}</b></div><div class="row"><span>${L.bal}</span><b style="font-weight:500">৳${nb}</b></div></div>
  <button class="btn ghost" data-a="reset">${L.again}</button>`;
 }
 h+=`</div><div class="note">${L.note}</div>`;
 if(s.scr=="sheet") h+=`<div class="scrim" data-a="close"><div class="sheet" role="dialog" aria-label="Pay Anyway"><h2>${L.short(short)}</h2><p>${L.sub}</p>
  <button class="opt main" data-a="opt" data-v="card"><b>${L.oc(s.amt)}</b><span>${L.ocs}</span></button>
  <button class="opt" data-a="opt" data-v="bank"><b>${L.ob(s.amt)}</b><span>${L.obs}</span></button>
  <button class="opt" data-a="opt" data-v="add"><b>${L.oa(short)}</b><span>${L.oas(short)}</span></button>
  <button class="btn ghost" data-a="close">${L.cx}</button></div></div>`;
 $.innerHTML=h;
 const i=document.getElementById("amt");
 if(i)i.onchange=()=>{const n=parseInt(i.value.replace(/\D/g,""))||500;s.amt=Math.min(Math.max(n,1),50000);render()};
}
$.addEventListener("click",e=>{
 const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=="close"&&e.target.closest(".sheet")&&!e.target.closest("button.ghost"))return;
 if(a=="lang")s.lang=s.lang=="en"?"bn":"en";
 else if(a=="src")s.src=v;
 else if(a=="chip")s.amt=+v;
 else if(a=="next"){s.pin="";s.bad=false;s.from="pay";if(s.src=="wallet"&&s.amt>BAL)s.scr="sheet";else{s.mode=s.src;s.scr="pin"}}
 else if(a=="close")s.scr="pay";
 else if(a=="opt"){s.mode=v;s.from="sheet";s.pin="";s.bad=false;s.scr="pin"}
 else if(a=="back"){if(s.scr=="pin")s.scr=s.from;else if(s.scr=="done")return reset()}
 else if(a=="key"){
  s.bad=false;if(v=="⌫")s.pin=s.pin.slice(0,-1);else if(s.pin.length<4)s.pin+=v;
  if(s.pin.length==4){if(s.pin=="1234"){s.scr="proc";render();setTimeout(()=>{s.scr="done";render()},1600);return}s.bad=true;s.pin=""}
 }
 else if(a=="reset")return reset();
 render();
});
function reset(){s={...s,scr:"pay",amt:500,mode:null,src:"wallet",from:"pay",pin:"",bad:false};render()}
render();
</script>
</body>
</html>
